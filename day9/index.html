<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A task dashboard for practicing REST API requests with JavaScript.">
    <title>TaskFlow | API Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">T</span>TaskFlow</a>
        <nav aria-label="Main navigation">
            <a class="active" href="#dashboard">Dashboard</a>
            <a href="#tasks">My tasks</a>
        </nav>
        <span class="training-label">Day 9 · API project</span>
    </header>

    <main id="dashboard" class="page-shell">
        <section class="page-heading" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">Your workspace</p>
                <h1 id="page-title">Tasks, in focus.</h1>
                <p>A small dashboard for planning your next steps.</p>
            </div>
        </section>

        <section class="summary-grid" aria-label="Task summary">
            <article class="summary-card">
                <p>Total tasks</p>
                <strong id="totalCount">—</strong>
            </article>
            <article class="summary-card">
                <p>To do</p>
                <strong id="openCount">—</strong>
            </article>
            <article class="summary-card">
                <p>Completed</p>
                <strong id="completedCount">—</strong>
            </article>
        </section>

        <section id="tasks" class="task-panel" aria-labelledby="tasks-title">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Task list</p>
                    <h2 id="tasks-title">Your tasks</h2>
                </div>
                <button id="retryButton" class="retry-button" type="button" hidden>Retry loading</button>
            </div>
            <form id="taskForm" class="task-form" aria-busy="false">
                <label for="taskTitle">Create a task</label>
                <div class="task-form-row">
                    <input id="taskTitle" name="title" type="text" maxlength="120" placeholder="What needs to get done?" aria-describedby="dashboardMessage" required>
                    <button id="submitTaskButton" class="primary-button" type="submit">Add task</button>
                </div>
            </form>
            <div class="task-controls">
                <label class="search-label" for="taskSearch">Search tasks
                    <input id="taskSearch" type="search" placeholder="Find a task by title" autocomplete="off" disabled>
                </label>
                <label class="filter-label" for="taskFilter">Show
                    <select id="taskFilter" disabled>
                        <option value="all">All tasks</option>
                        <option value="open">To do</option>
                        <option value="completed">Completed</option>
                    </select>
                </label>
            </div>
            <p id="dashboardMessage" class="dashboard-message" role="status" aria-live="polite">Loading tasks…</p>
            <div id="taskList" class="task-list"></div>
            <p id="emptyState" class="empty-state" hidden></p>
        </section>
    </main>

    <dialog id="taskDialog" class="task-dialog" aria-labelledby="taskDialogTitle">
        <form method="dialog" class="dialog-close-form">
            <button class="icon-button" aria-label="Close task details">×</button>
        </form>
        <div id="taskDialogContent"></div>
    </dialog>
</body>
</html>
